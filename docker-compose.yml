# localhostonly

services:

  frontend:
    build:
      context: ./app/client
    expose:
      - "80"
    restart: always
    depends_on:
      - backend
    networks:
      - sdw-crm-network

  backend:
    build:
      context: ./app/server
    env_file:
      - ./app/server/.env
    ports:
      - "8000:8000"
    restart: always
    depends_on:
      - mongodb
    networks:
      - sdw-crm-network

  mongodb:
    image: mongo:8
    container_name: sdw-crm-mongodb
    restart: always
    # ports:
    #   - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - sdw-crm-network

  nginx:
    image: nginx:latest
    container_name: sdw-crm-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - /etc/letsencrypt:/etc/letsencrypt
      - ./certbot:/var/www/certbot
    restart: always
    depends_on:
      - frontend
      - backend
    networks:
      - sdw-crm-network

networks:
  sdw-crm-network:

volumes:
  mongo_data:







